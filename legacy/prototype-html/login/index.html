<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Classroom Access Management System</title>
    <link rel="icon" href="data:,">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- หากเข้าสู่ระบบไว้แล้ว ให้ข้ามหน้า Login ไปยัง Dashboard ทันที -->
    <script>
      if (localStorage.getItem('token')) {
        window.location.replace('../dashboard/index.html');
      }
    </script>
    <!-- เรียกใช้ style.css ในโฟลเดอร์ login -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-badge">
        <span class="dot"></span>
        <span>Classroom Access Management System</span>
    </div>

    <div class="login-card">
        <!-- แก้ไข Path โลโก้ชี้ไปที่ LogoWhite.png ในโฟลเดอร์ login -->
        <div class="logo-wrapper">
            <img src="LogoWhite.png" alt="System Logo" class="logo-img" style="width: 80px; height: auto; object-fit: contain;">
        </div>

        <h2>Sign In</h2>
        <p class="subtitle">Enter your account credentials to access the classroom tracking system</p>

        <div id="alertError" class="alert-error" role="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope icon-left"></i>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="teacher_ajarn" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key icon-left"></i>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <a href="#" class="forgot-link">Forgot Password?</a>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span id="btnText">Sign In</span>
            </button>

            <!-- ปุ่มจำลองการทดสอบสำหรับผู้พัฒนา/อาจารย์ (Dev Demo Login) -->
            <button type="button" id="btnDemoLogin" class="btn-submit" style="margin-top: 12px; background: #0284c7; box-shadow: none;">
                <i class="fa-solid fa-bolt" style="margin-right: 6px;"></i>
                <span>Demo Login (เข้าใช้งานจำลอง)</span>
            </button>
        </form>

        <p class="register-text">
            Don't have an account? <a href="../register/register.html">Register for access</a>
        </p>
    </div>

    <div class="page-footer">
        © 2026 Classroom Access Management System (CAMS) • Automated RFID & IoT Logging
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
