<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" style="background-color:#ffffff;">
  <defs>
    <!-- Grid pattern matching diagrams.net / draw.io -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.75" stroke-dasharray="1,3"/>
    </pattern>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 9 1.5 L 0 5 L 9 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
    .box-container { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
    .title-text { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: bold; fill: #000000; }
    .node-title { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; font-size: 14px; font-weight: 600; fill: #000000; text-anchor: middle; }
    .node-sub { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; font-size: 12px; fill: #4b5563; text-anchor: middle; }
    .label-text { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; font-size: 11px; fill: #1f2937; text-anchor: middle; }
    .line { stroke: #000000; stroke-width: 1.3; fill: none; }
    .db-cyl { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
  </style>

  <!-- ==================== CENTRAL AUTH (GROUP 3) TOP ==================== -->
  <rect x="505" y="25" width="190" height="65" rx="2" class="box" />
  <text x="600" y="52" class="node-title">Central Auth API</text>
  <text x="600" y="72" class="node-sub">( กลุ่ม 3 )</text>

  <!-- Arrow Central Auth <-> Backend API (Bidirectional) -->
  <line x1="600" y1="90" x2="600" y2="175" class="line" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
  <rect x="606" y="115" width="195" height="24" fill="#ffffff" opacity="0.95" rx="3" />
  <text x="703" y="131" class="label-text">ตรวจสอบรหัสผ่านและสิทธิ์การใช้งาน</text>

  <!-- ==================== VM4 MAIN CONTAINER ==================== -->
  <rect x="220" y="150" width="760" height="400" rx="3" class="box-container" />
  <text x="240" y="177" class="title-text">เซิร์ฟเวอร์หลัก VM4</text>

  <!-- ==================== EXTERNAL USER (LEFT) ==================== -->
  <rect x="25" y="295" width="150" height="65" rx="2" class="box" />
  <text x="100" y="322" class="node-title">ผู้ใช้งาน</text>
  <text x="100" y="342" class="node-sub">( อาจารย์/นักศึกษา )</text>

  <!-- Arrow User -> Nginx -->
  <line x1="175" y1="327" x2="245" y2="327" class="line" marker-end="url(#arrow)" />
  <rect x="180" y="306" width="65" height="34" fill="#ffffff" opacity="0.95" rx="2" />
  <text x="212" y="319" class="label-text">ใช้งานผ่าน</text>
  <text x="212" y="334" class="label-text">HTTP</text>

  <!-- ==================== NGINX WEB SERVER ==================== -->
  <rect x="248" y="295" width="205" height="65" rx="2" class="box" />
  <text x="350" y="322" class="node-title">Nginx Web Server</text>
  <text x="350" y="342" class="node-sub">( รับข้อมูลและจัดเส้นทางของข้อมูล )</text>

  <!-- Arrow Nginx -> Backend API -->
  <path d="M 453 312 L 480 312 L 480 212 L 500 212" class="line" marker-end="url(#arrow)" />

  <!-- Arrow Nginx -> Frontend -->
  <line x1="453" y1="327" x2="500" y2="327" class="line" marker-end="url(#arrow)" />

  <!-- ==================== BACKEND API (TOP INSIDE VM4) ==================== -->
  <rect x="505" y="180" width="190" height="65" rx="2" class="box" />
  <text x="600" y="207" class="node-title">Backend API</text>
  <text x="600" y="227" class="node-sub">( ประมวลผลหลังบ้าน )</text>

  <!-- ==================== FRONTEND (MIDDLE INSIDE VM4) ==================== -->
  <rect x="505" y="295" width="190" height="65" rx="2" class="box" />
  <text x="600" y="322" class="node-title">Frontend</text>
  <text x="600" y="342" class="node-sub">( หน้าตาของเว็บไซต์ )</text>

  <!-- ==================== LINK BETWEEN FRONTEND & BACKEND API (CORRECTED) ==================== -->
  <line x1="600" y1="295" x2="600" y2="250" class="line" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
  <rect x="606" y="258" width="150" height="25" fill="#ffffff" opacity="0.95" rx="3" />
  <text x="681" y="269" class="label-text">เรียกใช้ REST API</text>
  <text x="681" y="280" class="label-text">+ แนบ Bearer Token</text>

  <!-- ==================== IOT SYNC (BOTTOM INSIDE VM4) ==================== -->
  <rect x="505" y="415" width="190" height="65" rx="2" class="box" />
  <text x="600" y="442" class="node-title">IOT Sync</text>
  <text x="600" y="462" class="node-sub">( ดึงข้อมูลจาก Logs )</text>

  <!-- ==================== MARIADB DATABASE (RIGHT INSIDE VM4) ==================== -->
  <g transform="translate(800, 260)">
    <path d="M 0 25 L 0 120 A 80 20 0 0 0 160 120 L 160 25 Z" class="db-cyl" />
    <ellipse cx="80" cy="25" rx="80" ry="20" class="db-cyl" />
    <path d="M 0 55 A 80 18 0 0 0 160 55" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M 0 85 A 80 18 0 0 0 160 85" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" />
    <text x="80" y="65" class="node-title">MariaDB Database</text>
    <text x="80" y="85" class="node-sub">( เก็บข้อมูลการแตะบัตร &amp;</text>
    <text x="80" y="103" class="node-sub">ประวัติการใช้งาน )</text>
  </g>

  <!-- Arrow Backend API -> MariaDB -->
  <path d="M 695 212 L 880 212 L 880 255" class="line" marker-end="url(#arrow)" />
  <rect x="715" y="195" width="130" height="28" fill="#ffffff" opacity="0.95" rx="2" />
  <text x="780" y="207" class="label-text">บันทึกประวัติการใช้งาน</text>
  <text x="780" y="220" class="label-text">และค้นหาข้อมูล</text>

  <!-- Arrow IOT Sync -> MariaDB -->
  <path d="M 695 447 L 880 447 L 880 405" class="line" marker-end="url(#arrow)" />
  <rect x="725" y="435" width="120" height="20" fill="#ffffff" opacity="0.95" rx="2" />
  <text x="785" y="449" class="label-text">กรองข้อมูลและบันทึก</text>

  <!-- ==================== IOT SERVER (GROUP 6) BOTTOM ==================== -->
  <rect x="505" y="580" width="190" height="65" rx="2" class="box" />
  <text x="600" y="607" class="node-title">IOT Server</text>
  <text x="600" y="627" class="node-sub">( กลุ่ม 6 )</text>

  <!-- Arrow IOT Server -> IOT Sync -->
  <line x1="600" y1="580" x2="600" y2="485" class="line" marker-end="url(#arrow)" />
  <rect x="606" y="525" width="120" height="22" fill="#ffffff" opacity="0.95" rx="2" />
  <text x="666" y="539" class="label-text">ดึงข้อมูลการแตะบัตร</text>
</svg>
