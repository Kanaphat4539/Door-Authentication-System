<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Classroom Access Management System — System Overview</title>
  <desc id="desc">ภาพรวมการเข้าสู่ระบบ ค้นประวัติการใช้ห้อง บันทึก audit และนำเข้าข้อมูลจาก IoT</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#52627a"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3d63dd"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#18865d"/></marker>
    <marker id="arrowBothStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,5 L10,10 z" fill="#52627a"/></marker>
    <style>
      text { font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; fill: #17243a; }
      .title { font-size: 34px; font-weight: 800; letter-spacing: .2px; }
      .subtitle { font-size: 17px; fill: #52627a; }
      .section-title { font-size: 17px; font-weight: 800; fill: #33445e; }
      .card-title { font-size: 19px; font-weight: 800; }
      .body { font-size: 15px; fill: #42516a; }
      .small { font-size: 13px; fill: #586780; }
      .tiny { font-size: 12px; fill: #586780; }
      .white { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #dce4ef; stroke-width: 1.5; }
      .actor { fill: #f1f5ff; stroke: #b7c7ef; stroke-width: 1.5; }
      .frontend { fill: #eff6ff; stroke: #8eb9f7; stroke-width: 1.5; }
      .frontend-child { fill: #ffffff; stroke: #c4dafa; stroke-width: 1.2; }
      .backend { fill: #f7f4ff; stroke: #b5a5ef; stroke-width: 1.6; }
      .backend-child { fill: #ffffff; stroke: #d3c8f4; stroke-width: 1.2; }
      .external { fill: #fff8eb; stroke: #e9c78e; stroke-width: 1.5; }
      .database { fill: #ecfbf7; stroke: #83cbb5; stroke-width: 1.5; }
      .iot { fill: #eefaf3; stroke: #8bc9a4; stroke-width: 1.5; }
      .cache { fill: #f4f6f9; stroke: #c6cfdb; stroke-width: 1.4; }
      .edge { fill: none; stroke: #52627a; stroke-width: 2.3; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #3d63dd; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edge-green { fill: none; stroke: #18865d; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .edge-return { fill: none; stroke: #3d63dd; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowBlue); }
      .edge-both { fill: none; stroke: #52627a; stroke-width: 2.2; marker-start: url(#arrowBothStart); marker-end: url(#arrow); }
      .edge-label { fill: #ffffff; stroke: #dce4ef; stroke-width: 1; }
      .badge { fill: #e9efff; }
      .badge-green { fill: #e1f6eb; }
      .badge-amber { fill: #fff1d7; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#f4f7fb"/>
  <text x="54" y="62" class="title">Classroom Access Management System</text>
  <text x="56" y="97" class="subtitle">ภาพรวมการทำงาน • ระบบดูประวัติการเข้า–ออกห้องเรียนของนักศึกษา</text>
  <rect x="1474" y="40" width="270" height="38" rx="19" fill="#e9efff"/>
  <text x="1609" y="65" text-anchor="middle" class="small" style="font-weight:800; fill:#3554b5">GROUP 4 · SYSTEM OVERVIEW</text>

  <rect x="40" y="145" width="1720" height="625" rx="24" class="panel"/>
  <text x="64" y="181" class="section-title">1 · เข้าสู่ระบบและค้นประวัติ</text>
  <rect x="40" y="800" width="1720" height="350" rx="24" class="panel"/>
  <text x="64" y="836" class="section-title">2 · รับและจัดเก็บข้อมูลจากอุปกรณ์ IoT</text>

  <!-- Integrated FastAPI backend boundary -->
  <rect x="690" y="198" width="625" height="910" rx="22" class="backend"/>
  <rect x="712" y="211" width="245" height="32" rx="16" fill="#e9e2ff"/>
  <text x="834" y="233" text-anchor="middle" class="small" style="font-weight:800; fill:#5a43a4">FASTAPI BACKEND · /api/v1</text>

  <!-- Actors -->
  <rect x="65" y="350" width="205" height="270" rx="18" class="actor"/>
  <text x="167" y="384" text-anchor="middle" class="card-title">ผู้ใช้งาน</text>
  <rect x="84" y="410" width="167" height="72" rx="14" fill="#ffffff" stroke="#c7d5f0"/>
  <circle cx="108" cy="446" r="12" fill="#5576d9"/>
  <text x="130" y="451" class="body" style="font-weight:700">นักศึกษา</text>
  <rect x="84" y="500" width="167" height="72" rx="14" fill="#ffffff" stroke="#c7d5f0"/>
  <circle cx="108" cy="536" r="12" fill="#8a63c7"/>
  <text x="130" y="541" class="body" style="font-weight:700">อาจารย์</text>
  <text x="167" y="598" text-anchor="middle" class="tiny">เข้าสู่ระบบด้วยบัญชีกลาง</text>

  <!-- Frontend -->
  <rect x="320" y="250" width="330" height="430" rx="20" class="frontend"/>
  <text x="345" y="286" class="card-title">เว็บแอป · Next.js</text>
  <text x="345" y="310" class="small">หน้าจอที่ผู้ใช้โต้ตอบ</text>
  <rect x="345" y="334" width="280" height="105" rx="14" class="frontend-child"/>
  <rect x="363" y="350" width="26" height="26" rx="8" class="badge"/>
  <text x="376" y="369" text-anchor="middle" class="small" style="font-weight:800; fill:#3554b5">1</text>
  <text x="401" y="370" class="body" style="font-weight:800">หน้าเข้าสู่ระบบ</text>
  <text x="363" y="400" class="small">ส่ง username / password</text>
  <text x="363" y="421" class="small">รับ JWT แล้วแนบ Bearer Token</text>
  <rect x="345" y="458" width="280" height="166" rx="14" class="frontend-child"/>
  <rect x="363" y="474" width="26" height="26" rx="8" class="badge"/>
  <text x="376" y="493" text-anchor="middle" class="small" style="font-weight:800; fill:#3554b5">2</text>
  <text x="401" y="494" class="body" style="font-weight:800">Dashboard</text>
  <text x="363" y="523" class="small">ตัวกรอง · ตารางประวัติ · สถิติ</text>
  <text x="363" y="546" class="small">รหัสนักศึกษา / ห้อง / วันที่ / เวลา</text>
  <text x="363" y="569" class="small">สถานะ / แบ่งหน้า / รีเฟรชข้อมูล</text>
  <text x="363" y="600" class="tiny">นักศึกษาเห็นรหัสของตนเองแบบล็อกไว้</text>
  <text x="345" y="653" class="tiny">ออกจากระบบ: ล้าง token ฝั่ง browser</text>

  <!-- Auth and log API -->
  <rect x="720" y="265" width="260" height="180" rx="16" class="backend-child"/>
  <rect x="738" y="281" width="26" height="26" rx="8" class="badge"/>
  <text x="751" y="300" text-anchor="middle" class="small" style="font-weight:800; fill:#5a43a4">3</text>
  <text x="776" y="301" class="body" style="font-weight:800">ยืนยันตัวตน</text>
  <text x="740" y="332" class="small">POST /api/v1/auth/login</text>
  <text x="740" y="355" class="small">ตรวจผลบัญชีกลางและ role</text>
  <text x="740" y="378" class="small">ออก JWT (username, role, exp)</text>
  <text x="740" y="414" class="tiny">ไม่ผ่าน → 401 · /auth/me · /logout</text>

  <rect x="1000" y="265" width="285" height="382" rx="16" class="backend-child"/>
  <rect x="1018" y="281" width="26" height="26" rx="8" class="badge"/>
  <text x="1031" y="300" text-anchor="middle" class="small" style="font-weight:800; fill:#5a43a4">4</text>
  <text x="1056" y="301" class="body" style="font-weight:800">Logs API + RBAC</text>
  <text x="1020" y="332" class="small">GET /api/v1/logs</text>
  <text x="1020" y="359" class="small">ตรวจ JWT ก่อนอ่านข้อมูล</text>
  <line x1="1020" y1="374" x2="1265" y2="374" stroke="#e6e0f5"/>
  <rect x="1020" y="390" width="245" height="68" rx="12" fill="#f3efff"/>
  <text x="1035" y="416" class="small" style="font-weight:800; fill:#6045aa">อาจารย์</text>
  <text x="1035" y="440" class="tiny">ค้นได้ทุกคนและทุกห้อง</text>
  <rect x="1020" y="470" width="245" height="77" rx="12" fill="#eef4ff"/>
  <text x="1035" y="496" class="small" style="font-weight:800; fill:#3554b5">นักศึกษา</text>
  <text x="1035" y="520" class="tiny">บังคับ owner จาก JWT · ดูเฉพาะตนเอง</text>
  <text x="1020" y="576" class="tiny">ตัวกรอง: รหัส · ห้อง · วันที่ · เวลา · สถานะ</text>
  <text x="1020" y="599" class="tiny">คืนผล: logs · สถิติ · pagination</text>
  <text x="1020" y="624" class="tiny">บันทึกการค้นหา/กรองลง audit log</text>

  <!-- External central auth -->
  <rect x="1395" y="245" width="310" height="165" rx="18" class="external"/>
  <rect x="1415" y="264" width="34" height="34" rx="10" class="badge-amber"/>
  <text x="1432" y="287" text-anchor="middle" class="small" style="font-weight:800; fill:#9a6818">G3</text>
  <text x="1461" y="286" class="card-title">Central Auth</text>
  <text x="1417" y="325" class="body">ตรวจ username / password</text>
  <text x="1417" y="350" class="small">ส่งคืน identity และ role</text>
  <text x="1417" y="383" class="tiny">กลุ่ม 3 · /auth/login</text>

  <!-- MariaDB -->
  <rect x="1395" y="485" width="310" height="235" rx="18" class="database"/>
  <text x="1420" y="523" class="card-title">MariaDB · web_app_db</text>
  <rect x="1420" y="545" width="260" height="65" rx="12" fill="#ffffff" stroke="#b6e3d5"/>
  <text x="1437" y="571" class="body" style="font-weight:800; fill:#147654">web_app</text>
  <text x="1437" y="595" class="small">ประวัติแตะบัตร · IN / OUT</text>
  <rect x="1420" y="625" width="260" height="65" rx="12" fill="#ffffff" stroke="#b6e3d5"/>
  <text x="1437" y="651" class="body" style="font-weight:800; fill:#147654">user</text>
  <text x="1437" y="675" class="small">Audit log · ผู้ใช้ / role / action</text>

  <!-- User and frontend connectors -->
  <path d="M270 485 H320" class="edge-blue"/>
  <rect x="270" y="449" width="95" height="26" rx="13" class="edge-label"/>
  <text x="317" y="467" text-anchor="middle" class="tiny">เปิดเว็บ</text>
  <path d="M625 382 H720" class="edge-blue"/>
  <rect x="625" y="344" width="132" height="26" rx="13" class="edge-label"/>
  <text x="691" y="362" text-anchor="middle" class="tiny">POST /auth/login</text>
  <path d="M980 310 H1395" class="edge"/>
  <rect x="1090" y="276" width="190" height="26" rx="13" class="edge-label"/>
  <text x="1185" y="294" text-anchor="middle" class="tiny">ตรวจสอบ credentials</text>
  <path d="M1395 365 H980" class="edge-return"/>
  <rect x="1095" y="370" width="180" height="26" rx="13" class="edge-label"/>
  <text x="1185" y="388" text-anchor="middle" class="tiny">identity + role</text>
  <path d="M720 420 H625" class="edge-return"/>
  <rect x="628" y="414" width="80" height="26" rx="13" class="edge-label"/>
  <text x="668" y="432" text-anchor="middle" class="tiny">JWT</text>
  <path d="M625 540 H1000" class="edge-blue"/>
  <rect x="698" y="503" width="215" height="26" rx="13" class="edge-label"/>
  <text x="805" y="521" text-anchor="middle" class="tiny">GET /logs + Bearer JWT</text>
  <path d="M1000 590 H625" class="edge-return"/>
  <rect x="693" y="602" width="230" height="26" rx="13" class="edge-label"/>
  <text x="808" y="620" text-anchor="middle" class="tiny">ประวัติ + สถิติ + pagination</text>
  <path d="M1285 380 H1340 V575 H1395" class="edge-green"/>
  <rect x="1300" y="437" width="120" height="26" rx="13" class="edge-label"/>
  <text x="1360" y="455" text-anchor="middle" class="tiny">อ่าน web_app</text>
  <path d="M1285 590 H1350 V657 H1395" class="edge"/>
  <rect x="1290" y="615" width="104" height="26" rx="13" class="edge-label"/>
  <text x="1342" y="633" text-anchor="middle" class="tiny">เขียน audit</text>

  <!-- IoT ingestion -->
  <rect x="715" y="855" width="270" height="185" rx="16" class="backend-child"/>
  <rect x="733" y="873" width="34" height="34" rx="10" class="badge-green"/>
  <text x="750" y="896" text-anchor="middle" class="small" style="font-weight:800; fill:#147654">5</text>
  <text x="779" y="895" class="body" style="font-weight:800">IoT Sync / Ingestion</text>
  <text x="735" y="930" class="small">/iot/sync · /iot/webhook</text>
  <text x="735" y="954" class="small">ดึง/รับ → ตรวจ → deduplicate</text>
  <text x="735" y="978" class="small">→ บันทึก access logs</text>
  <text x="735" y="1017" class="tiny">sync ตอนเริ่มระบบ · poll เมื่อเปิดใช้ตามรอบ</text>

  <rect x="1020" y="885" width="245" height="135" rx="16" class="cache"/>
  <text x="1042" y="920" class="body" style="font-weight:800">Local synced cache</text>
  <text x="1042" y="950" class="small">สำรองรายการที่ sync แล้ว</text>
  <text x="1042" y="976" class="small">ในไฟล์ local cache</text>

  <rect x="1395" y="865" width="310" height="170" rx="18" class="iot"/>
  <rect x="1415" y="884" width="34" height="34" rx="10" class="badge-green"/>
  <text x="1432" y="907" text-anchor="middle" class="small" style="font-weight:800; fill:#147654">G6</text>
  <text x="1461" y="906" class="card-title">IoT Server</text>
  <text x="1417" y="946" class="body">ข้อมูลแตะบัตรเข้า–ออกห้อง</text>
  <text x="1417" y="974" class="small">GET /api/logs · กลุ่ม 6</text>
  <text x="1417" y="1007" class="tiny">ส่งข้อมูลแบบ webhook ได้เช่นกัน</text>

  <!-- IoT and manual-sync connectors -->
  <path d="M985 905 H1395" class="edge-both"/>
  <rect x="1080" y="869" width="220" height="26" rx="13" class="edge-label"/>
  <text x="1190" y="887" text-anchor="middle" class="tiny">poll GET /api/logs</text>
  <path d="M1395 982 H985" class="edge-green"/>
  <rect x="1080" y="988" width="220" height="26" rx="13" class="edge-label"/>
  <text x="1190" y="1006" text-anchor="middle" class="tiny">records / webhook</text>
  <path d="M850 855 V785 H1350 V720 H1395" class="edge-green"/>
  <rect x="1000" y="754" width="255" height="26" rx="13" class="edge-label"/>
  <text x="1127" y="772" text-anchor="middle" class="tiny">ข้อมูลที่ผ่านตรวจ → web_app</text>
  <path d="M985 970 H1020" class="edge"/>
  <rect x="980" y="1030" width="128" height="24" rx="12" class="edge-label"/>
  <text x="1044" y="1047" text-anchor="middle" class="tiny">cache / fallback</text>
  <path d="M625 615 H665 V1090 H715 V1005" class="edge-blue"/>
  <rect x="505" y="1015" width="178" height="26" rx="13" class="edge-label"/>
  <text x="594" y="1033" text-anchor="middle" class="tiny">รีเฟรช / manual sync</text>

  <!-- Notes and legend -->
  <rect x="65" y="875" width="285" height="150" rx="16" class="iot"/>
  <text x="88" y="911" class="body" style="font-weight:800">แหล่งข้อมูล</text>
  <text x="88" y="943" class="small">เครื่องอ่านบัตรส่งรายการ</text>
  <text x="88" y="968" class="small">เข้า / ออก พร้อมรหัสผู้ใช้</text>
  <text x="88" y="1003" class="tiny">ข้อมูลใหม่ถูกตรวจและกันรายการซ้ำ</text>

  <line x1="65" y1="1090" x2="115" y2="1090" class="edge-blue"/>
  <text x="126" y="1095" class="tiny">คำขอ / การเรียก API</text>
  <line x1="300" y1="1090" x2="350" y2="1090" class="edge-return"/>
  <text x="361" y="1095" class="tiny">ผลตอบกลับ / token</text>
  <line x1="520" y1="1090" x2="570" y2="1090" class="edge-green"/>
  <text x="581" y="1095" class="tiny">ข้อมูล access log</text>
  <text x="1735" y="1130" text-anchor="end" class="tiny">ระบบตามโค้ดใน branch dev · ภาพรวมการทำงาน</text>
</svg>
