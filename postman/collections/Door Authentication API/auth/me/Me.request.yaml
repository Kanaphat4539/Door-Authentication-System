$kind: http-request
description: ตรวจสอบ Token และดึง username
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Me.resources/examples
order: 1000
