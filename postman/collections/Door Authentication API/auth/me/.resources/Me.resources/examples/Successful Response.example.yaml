$kind: http-example
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "string"
      }
    $type: |-
      {
        "title": "UserResponse",
        "type": "object",
        "properties": {
          "username": {
            "type": "string",
            "title": "Username"
          }
        },
        "required": [
          "username"
        ]
      }
order: 1000
