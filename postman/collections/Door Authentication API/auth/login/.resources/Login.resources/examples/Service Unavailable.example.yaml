$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "student",
        "password": "local-demo-password"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  body:
    type: text
    content: ""
order: 4000
